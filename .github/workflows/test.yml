name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Every test, and 100 % lines, branches and functions of src/.
      - run: npm test

  # The oldest supported Node: the tests without the coverage gate (its flags came in Node 22).
  node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node --test test/*.test.js

  # What npm would publish installs and runs.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm pack
      - run: |
          cd "$(mktemp -d)" && git init -q
          npm install --no-save "$GITHUB_WORKSPACE"/cli-kanban-*.tgz
          npx cli-kanban init --text && npx cli-kanban add "Smoke test" --text
          test -f node_modules/cli-kanban/agents/skills/cli-kanban/SKILL.md
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | npx cli-kanban mcp | grep -q kanban_move
